syntax = "proto3";

package calcifer.v1;

import "calcifer/v1/entities.proto";
import "calcifer/v1/structures.proto";
import "google/protobuf/timestamp.proto";

service EntityService {
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  // For the agent: the frontend's replica comes from WatchEntities (ADR 9). An empty
  // structure_type lists every entity; one not in the registry is
  // INVALID_ARGUMENT.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  // Create a new entity from intent. The server mints the id, timestamps,
  // default properties and default name ("Untitled <structure name>", or for a
  // unique-names structure the first free "Untitled <name> N"). INVALID_ARGUMENT
  // for a structure_type not in the registry or a property value of the wrong
  // kind; FAILED_PRECONDITION for a structure that isn't creatable (a DailyNote
  // comes from ResolveEntity by date); ALREADY_EXISTS for a taken Tag name.
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  // Change only an entity's name. Other properties are untouched, so a rename
  // doesn't overwrite a concurrent SetEntityProperty. The name is trimmed; a blank
  // one is INVALID_ARGUMENT. NOT_FOUND for an unknown id, FAILED_PRECONDITION
  // for a structure whose name isn't editable (DailyNote), ALREADY_EXISTS for a
  // taken Tag name.
  rpc RenameEntity(RenameEntityRequest) returns (RenameEntityResponse);
  // Write one property without resending the rest of the entity, so concurrent
  // edits to different properties don't overwrite each other. Returns the saved
  // entity. Renames go through RenameEntity.
  // A DailyNote's name is derived from its date: setting `date` on a DailyNote
  // also sets its name, and fails with ALREADY_EXISTS if that day already has a
  // DailyNote.
  rpc SetEntityProperty(SetEntityPropertyRequest) returns (SetEntityPropertyResponse);
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  // One-way replication of the whole entity set (ADR 9):
  // - The first message on every stream is a `snapshot`.
  // - After it come events with increasing `revision`.
  // - Whenever the server can't guarantee continuity (the subscriber lagged),
  //   it sends a fresh `snapshot`, and the client must replace its whole set.
  // - A snapshot doesn't include rich-text docs; clients refetch any doc they
  //   hold.
  // - Revisions restart when the server restarts. Clients never compare
  //   revisions across streams.
  // A reconnect is a new stream, so it starts with a snapshot; there is no
  // resume from a revision.
  rpc WatchEntities(WatchEntitiesRequest) returns (stream WatchEntitiesResponse);
  // Get-or-create one entity by a key: a (structure_type, name) pair for
  // [[wikilinks]], mentions and #tags, or a calendar day for its DailyNote. The
  // single server-authoritative identity path for every client. The server
  // builds a created entity's defaults and, for a DailyNote, its name.
  // Names match case-insensitively. Only Tag names are unique, so for other
  // structures several entities can share a name: the one with the oldest
  // created_at wins, and the lowest id breaks ties. A day has at most one
  // DailyNote.
  rpc ResolveEntity(ResolveEntityRequest) returns (ResolveEntityResponse);
  // The links pointing AT an entity: one Backlink per link row, so a source
  // that links from two properties appears twice. Newest `created_at` first;
  // ties go to the lower source entity id, then the lower link id. Self-links
  // (a source linking to itself) are excluded, as the frontend's backlinks
  // panel excludes them. NOT_FOUND for an unknown entity_id.
  // For the agent: the frontend derives backlinks from its WatchEntities replica.
  rpc ListBacklinks(ListBacklinksRequest) returns (ListBacklinksResponse);
}

service RichTextService {
  // A declared rich-text property with nothing saved returns an empty doc and
  // epoch updated_at. NOT_FOUND means the entity doesn't exist. INVALID_ARGUMENT
  // means the property isn't a declared rich-text property of the entity's
  // structure.
  rpc GetRichText(GetRichTextRequest) returns (GetRichTextResponse);
  rpc PutRichText(PutRichTextRequest) returns (PutRichTextResponse);
}

// Search over note names + bodies: lexical (SQLite FTS5), semantic (embeds the
// query and runs vector KNN over chunk embeddings via sqlite-vec), or hybrid
// (both, fused by reciprocal-rank fusion).
service SearchService {
  // For the agent: the frontend doesn't call it (ADR 9).
  rpc Search(SearchRequest) returns (SearchResponse);
}

// The structure registry (ADR 7). Authored in server/src/structures.rs; clients
// fetch it instead of keeping their own copy. No filters: every structure, in
// the server's table order.
service StructureService {
  rpc ListStructures(ListStructuresRequest) returns (ListStructuresResponse);
}

// How Search ranks. With embeddings off (the model failed to load), SEMANTIC and
// HYBRID behave exactly as LEXICAL.
enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;  // the server treats it as HYBRID
  SEARCH_MODE_LEXICAL = 1;      // FTS5 prefix match over name + body, bm25 order
  SEARCH_MODE_SEMANTIC = 2;     // vector KNN only
  SEARCH_MODE_HYBRID = 3;       // vector KNN and FTS5, fused by reciprocal rank
}

message SearchRequest {
  string query = 1;
  uint32 limit = 2;  // 0 => server default (10)
  SearchMode mode = 3;
}
message SearchResponse { repeated SearchHit hits = 1; }

// A half-open [start, end) range of UTF-16 code units into `SearchHit.snippet`.
message MatchRange {
  uint32 start = 1;
  uint32 end = 2;
}

message SearchHit {
  Entity entity = 1;
  // Plain text around the best lexical match, with no markup; `matches` says
  // where the query terms are. Empty for a hit that only the vector side found.
  // The server marks matches internally with U+E000 and U+E001 and strips them,
  // so a document containing those private-use characters loses them from its
  // snippet, and they can shift a match range.
  string snippet = 2;
  // Higher is better. Only comparable within one response.
  double score = 3;
  // The matched terms in `snippet`, in order. Empty when `snippet` is.
  repeated MatchRange matches = 4;
}

message GetEntityRequest      { string id = 1; }
message GetEntityResponse     { Entity entity = 1; }
message ListEntitiesRequest   { string structure_type = 1; }
message ListEntitiesResponse  { repeated Entity entities = 1; }
message CreateEntityRequest {
  reserved 1;
  reserved "entity";
  string structure_type = 2;
  // Unset or empty: the server's default name. Ignored for a DailyNote, whose
  // name is always derived from its `date`.
  optional string name = 3;
  // Initial values, laid over the structure's defaults (the request wins on the
  // same id). The server mints the id, timestamps and default properties.
  map<string, PropertyValue> properties = 4;   // keyed by property id
}
message CreateEntityResponse  { Entity entity = 1; }
message RenameEntityRequest   { string id = 1; string name = 2; }
message RenameEntityResponse  { Entity entity = 1; }
message DeleteEntityRequest   { string id = 1; }
message DeleteEntityResponse  {}
message SetEntityPropertyRequest {
  string entity_id = 1;
  string property_id = 2;
  PropertyValue value = 3;   // unset, or set with no case = clear (delete the property row)
}
message SetEntityPropertyResponse { Entity entity = 1; }
message WatchEntitiesRequest  {}

message ListBacklinksRequest { string entity_id = 1; }
message Backlink {
  Entity source = 1;                          // the entity whose content/relations link here
  string source_property_id = 2;              // which property the link came from
  google.protobuf.Timestamp created_at = 3;   // when that link was first derived
}
message ListBacklinksResponse { repeated Backlink backlinks = 1; }

message ListStructuresRequest  {}
message ListStructuresResponse { repeated StructureDef structures = 1; }

message ResolveEntityRequest {
  string structure_type = 1;          // required for `name`; must be "" or "DailyNote" for `date`
  oneof key {
    string name = 2;                  // case-insensitive
    string date = 3;                  // ISO yyyy-MM-dd; finds the day's DailyNote
  }
  bool create_if_missing = 4;         // false and missing => NOT_FOUND
}
message ResolveEntityResponse {
  Entity entity = 1;
  bool created = 2;                   // true if this call minted the entity
}

// Every entity, sent by WatchEntities at the start of a stream and after a lag.
message EntitySnapshot { repeated Entity entities = 1; }

message WatchEntitiesResponse {
  oneof event {
    Entity upserted = 1;
    string deleted_id = 2;
    // A RichTextService.PutRichText saved this document (ref, doc, updated_at).
    RichText rich_text_changed = 3;
    // Replaces the client's whole entity set. Rich-text docs aren't included.
    EntitySnapshot snapshot = 4;
  }
  // Monotonic per server process. A snapshot carries the revision it is
  // current as of; the events after it carry higher ones.
  uint64 revision = 15;
}

message GetRichTextRequest {
  string entity_id = 1;
  string property_id = 2;   // a declared rich-text property of the entity's structure
}
message GetRichTextResponse { RichText rich_text = 1; }

message PutRichTextRequest {
  string entity_id = 1;
  string property_id = 2;   // a declared rich-text property of the entity's structure
  // TipTap JSON; see RichText.doc and docs/reference/richtext-doc.md. The
  // server derives this property's links, the entity's referenced_dates and its
  // search text from it; clients never send those.
  string doc = 3;
  // Unset means an unconditional write. Set means the write fails with
  // FAILED_PRECONDITION unless the stored document's updated_at equals it
  // exactly. The epoch (0 seconds, 0 nanos) means "expect nothing saved yet".
  // Clients echo back the updated_at they last read.
  google.protobuf.Timestamp expected_updated_at = 4;
}
message PutRichTextResponse { RichText rich_text = 1; }
