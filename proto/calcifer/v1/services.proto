syntax = "proto3";

package calcifer.v1;

import "calcifer/v1/entities.proto";
import "calcifer/v1/structures.proto";
import "google/protobuf/empty.proto";

service EntityService {
  rpc Get(GetEntityRequest) returns (Entity);
  rpc List(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc Create(CreateEntityRequest) returns (Entity);
  rpc Update(UpdateEntityRequest) returns (Entity);
  // Write one property without resending the rest of the entity, so concurrent
  // edits to different properties don't overwrite each other. Returns the saved
  // entity. Use Update for renames and multi-field edits.
  rpc SetProperty(SetPropertyRequest) returns (Entity);
  rpc Delete(DeleteEntityRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchRequest) returns (stream EntityEvent);
  // Get-or-create an entity by (structure_type, name), case-insensitive.
  // The single server-authoritative identity path for [[wikilinks]] / #tags.
  rpc ResolveByName(ResolveByNameRequest) returns (ResolveByNameResponse);
  // Entities whose link graph points AT this entity (server-side backlink scan).
  rpc ListBacklinks(EntityRef) returns (ListEntitiesResponse);
  // Server-authoritative creation of the one DailyNote for a calendar day.
  // Returns already_exists if a DailyNote for that date already exists.
  rpc CreateDailyNote(CreateDailyNoteRequest) returns (Entity);
}

service RichTextService {
  rpc Get(RichTextRef) returns (RichText);
  rpc Put(RichText) returns (RichText);
}

// Search over note names + bodies. `Search` is lexical (SQLite FTS5); `Retrieve`
// is semantic — embeds the query and runs vector KNN over chunk embeddings
// (sqlite-vec), optionally fused with FTS5 via reciprocal-rank fusion.
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  // Semantic retrieval. With hybrid=true, fuses vector KNN + FTS5 via RRF;
  // otherwise pure vector KNN. Falls back to lexical when embeddings are off.
  rpc Retrieve(RetrieveRequest) returns (SearchResponse);
}

// The structure registry (ADR 7). Authored in server/src/structures.rs; clients
// fetch it instead of keeping their own copy. No filters: every structure, in
// the server's table order.
service StructureService {
  rpc List(ListStructuresRequest) returns (ListStructuresResponse);
}

message SearchRequest  { string query = 1; uint32 limit = 2; }
message RetrieveRequest {
  string query = 1;
  uint32 k = 2;       // number of hits to return (0 => server default)
  bool hybrid = 3;    // true: RRF-fuse vector + FTS5; false: pure vector KNN
}
message SearchResponse { repeated SearchHit hits = 1; }
message SearchHit {
  Entity entity = 1;
  string snippet = 2;
  double score = 3;
}

message GetEntityRequest      { string id = 1; }
message ListEntitiesRequest   { string structure_type = 1; }
message ListEntitiesResponse  { repeated Entity entities = 1; }
message CreateEntityRequest   { Entity entity = 1; }
message UpdateEntityRequest   { Entity entity = 1; }
message DeleteEntityRequest   { string id = 1; }
message SetPropertyRequest {
  string entity_id = 1;
  string property_id = 2;
  PropertyValue value = 3;   // unset, or set with no case = clear (delete the property row)
}
message WatchRequest          {}

message ListStructuresRequest  {}
message ListStructuresResponse { repeated StructureDef structures = 1; }

message CreateDailyNoteRequest { string date = 1; }  // ISO calendar day, e.g. "2026-06-13"

message ResolveByNameRequest {
  string structure_type = 1;
  string name = 2;
  bool create_if_missing = 3;
}
message ResolveByNameResponse {
  Entity entity = 1;
  bool created = 2;   // true if this call minted the entity
}

message EntityEvent {
  oneof event {
    Entity upserted = 1;
    string deleted_id = 2;
  }
}
