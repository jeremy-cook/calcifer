syntax = "proto3";

package calcifer.v1;

import "calcifer/v1/entities.proto";
import "google/protobuf/empty.proto";

service EntityService {
  rpc Get(GetEntityRequest) returns (Entity);
  rpc List(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc Create(CreateEntityRequest) returns (Entity);
  rpc Update(UpdateEntityRequest) returns (Entity);
  rpc Delete(DeleteEntityRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchRequest) returns (stream EntityEvent);
  // Get-or-create an entity by (structure_type, name), case-insensitive.
  // The single server-authoritative identity path for [[wikilinks]] / #tags.
  rpc ResolveByName(ResolveByNameRequest) returns (ResolveByNameResponse);
}

service RichTextService {
  rpc Get(RichTextRef) returns (RichText);
  rpc Put(RichText) returns (RichText);
}

// Lexical (full-text) search over note names + bodies, backed by SQLite FTS5.
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest  { string query = 1; uint32 limit = 2; }
message SearchResponse { repeated SearchHit hits = 1; }
message SearchHit {
  Entity entity = 1;
  string snippet = 2;
  double score = 3;
}

message GetEntityRequest      { string id = 1; }
message ListEntitiesRequest   { string structure_type = 1; }
message ListEntitiesResponse  { repeated Entity entities = 1; }
message CreateEntityRequest   { Entity entity = 1; }
message UpdateEntityRequest   { Entity entity = 1; }
message DeleteEntityRequest   { string id = 1; }
message WatchRequest          {}

message ResolveByNameRequest {
  string structure_type = 1;
  string name = 2;
  bool create_if_missing = 3;
}
message ResolveByNameResponse {
  Entity entity = 1;
  bool created = 2;   // true if this call minted the entity
}

message EntityEvent {
  oneof event {
    Entity upserted = 1;
    string deleted_id = 2;
  }
}
