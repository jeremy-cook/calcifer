syntax = "proto3";

package calcifer.v1;

import "google/protobuf/timestamp.proto";

message EntityRef {
  string id = 1;
  string structure_type = 2;
}

message EntityRefList {
  repeated EntityRef refs = 1;
}

message PropertyValue {
  oneof value {
    string text = 1;
    double number = 2;
    string date = 3;
    string select = 4;
    EntityRef relation = 5;
    RichTextRef richtext = 6;
    EntityRefList relations = 7;   // multi-target relation; server derives links from it
  }
}

message Property {
  string id = 1;
  PropertyValue value = 2;
}

message RichTextRef {
  string entity_id = 1;
  string property_id = 2;
}

message RichText {
  RichTextRef ref = 1;
  string doc = 2;
  google.protobuf.Timestamp updated_at = 3;
  // Put only; ignored on output. Unset means an unconditional write. Set means
  // the write fails with FAILED_PRECONDITION unless the stored document's
  // updated_at equals it exactly. The epoch (0 seconds, 0 nanos) means "expect
  // nothing saved yet". Clients echo back the updated_at they last read.
  google.protobuf.Timestamp expected_updated_at = 4;
}

message LinkRef {
  string id = 1;
  EntityRef target = 2;
  string source_property_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Entity {
  string id = 1;
  string structure_type = 2;
  string name = 3;
  repeated Property properties = 4;
  repeated LinkRef links = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated string referenced_dates = 8;
}
