syntax = "proto3";

package calcifer.v1;

import "google/protobuf/timestamp.proto";

message EntityRef {
  string id = 1;
  string structure_type = 2;
}

message EntityRefList {
  repeated EntityRef refs = 1;
}

// A rich-text property has no PropertyValue: its document is addressed by
// (entity id, declared property id) through RichTextService (ADR 8, I-22).
message PropertyValue {
  reserved 6;
  reserved "richtext";
  oneof value {
    string text = 1;
    double number = 2;
    string date = 3;
    string select = 4;
    EntityRef relation = 5;
    EntityRefList relations = 7;   // multi-target relation; server derives links from it
  }
}

// RichTextService's address for one document: an entity and one of its
// structure's declared rich-text property ids.
message RichTextRef {
  string entity_id = 1;
  string property_id = 2;
}

message RichText {
  RichTextRef ref = 1;
  string doc = 2;
  google.protobuf.Timestamp updated_at = 3;
  // Put only; ignored on output. Unset means an unconditional write. Set means
  // the write fails with FAILED_PRECONDITION unless the stored document's
  // updated_at equals it exactly. The epoch (0 seconds, 0 nanos) means "expect
  // nothing saved yet". Clients echo back the updated_at they last read.
  google.protobuf.Timestamp expected_updated_at = 4;
}

message LinkRef {
  string id = 1;
  EntityRef target = 2;
  string source_property_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Output only: no request message carries an Entity (ADR 8). Clients write
// through Create, Rename, SetProperty and Delete.
message Entity {
  string id = 1;                                  // output only
  string structure_type = 2;
  string name = 3;
  map<string, PropertyValue> properties = 4;     // keyed by property id
  repeated LinkRef links = 5;                     // output only
  google.protobuf.Timestamp created_at = 6;       // output only
  google.protobuf.Timestamp updated_at = 7;       // output only
  repeated string referenced_dates = 8;           // output only
}
