[package]
name = "calcifer-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
futures = "0.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tonic-web = "0.12"
tower-http = { version = "0.6", features = ["cors"] }
# Semantic retrieval (M8): sqlite-vec for vec0 KNN, fastembed for in-process
# local ONNX embeddings (downloads all-MiniLM-L6-v2 on first use, 384-dim).
# libsqlite3-sys is pinned to sqlx-sqlite 0.9's version so we can register the
# sqlite-vec extension via sqlite3_auto_extension before any pool connects.
sqlite-vec = "0.1"
libsqlite3-sys = "0.37"
fastembed = "5"

[build-dependencies]
tonic-build = "0.12"
