[package]
name = "calcifer-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
calcifer = { path = "../proto/rs" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
futures = "0.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tonic-web = "0.14"
# Lets grpcurl list and call the RPCs on the native gRPC routes without the protos.
tonic-reflection = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
# The one HTTP surface: gRPC-Web (tonic routes), native gRPC, the built UI, and
# /mcp. Matches the axum tonic 0.14 is built on. `http2` so the listener also
# takes cleartext HTTP/2, which native gRPC needs.
axum = { version = "0.8", features = ["http2"] }
tower = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
# Semantic retrieval (M8): sqlite-vec for vec0 KNN, fastembed for in-process
# local ONNX embeddings (downloads all-MiniLM-L6-v2 on first use, 384-dim).
# libsqlite3-sys is pinned to sqlx-sqlite 0.9's version so we can register the
# sqlite-vec extension via sqlite3_auto_extension before any pool connects.
sqlite-vec = "0.1"
libsqlite3-sys = "0.37"
fastembed = "5"

[dev-dependencies]
# Reads a gRPC response's trailers in the routing tests.
http-body-util = "0.1"

[lints.clippy]
# Beyond clippy's default set: lints that have caught real noise here and
# have few or no hits. `pedantic` as a whole is too noisy (doc_markdown alone
# is over 200).
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
